<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des consommables</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-login {
      background: #ffffff;
      border: 1px solid #2563eb;
      color: #2563eb;
    }

    .btn-signup {
      background: #2563eb;
      color: white;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 45px;
    }

    .hero h2 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      color: #6b7280;
    }

    .catalogue-title {
      margin-bottom: 20px;
    }

    #consommables {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #e5e7eb;
    }

    .card-content {
      padding: 18px;
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .card p {
      color: #6b7280;
      line-height: 1.5;
    }

    .reserve {
      width: 100%;
      background: #2563eb;
      color: white;
      margin-top: 10px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #6b7280;
      background: white;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Gestion des consommables</h1>

    <div class="buttons">
      <button class="btn-login" onclick="connexion()">
        Se connecter
      </button>

      <button class="btn-signup" onclick="inscription()">
        Créer un compte
      </button>
    </div>
  </header>

  <main>

    <section class="hero">
      <h2>Bienvenue</h2>

      <p>
        Consultez les consommables disponibles
        et effectuez une demande de réservation.
      </p>
    </section>

    <section>
      <h2 class="catalogue-title">
        Consommables disponibles
      </h2>

      <div id="consommables">
        <div class="empty">
          Chargement des consommables...
        </div>
      </div>
    </section>

  </main>

  <script>
    function connexion() {
      alert("La page de connexion sera ajoutée prochainement.");
    }

    function inscription() {
      alert("La page d'inscription sera ajoutée prochainement.");
    }
  </script>

</body>
</html>
