<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des consommables</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    button {
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #2563eb;
      background: white;
      color: #2563eb;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h2 {
      font-size: 34px;
    }

    .hero p {
      color: #6b7280;
    }

    #consommables {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 18px;
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: #6b7280;
      line-height: 1.5;
    }

    .reserve {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      margin-top: 10px;
    }

    .message {
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<header>
  <h1>Gestion des consommables</h1>

<div id="zone-utilisateur">
  <a href="connexion.html">Se connecter</a>
  <a href="inscription.html">Créer un compte</a>
</div>
</header>

<main>

  <section class="hero">
    <h2>Bienvenue</h2>

    <p>
      Consultez les consommables disponibles
      et effectuez une demande de réservation.
    </p>
  </section>

  <h2>Consommables disponibles</h2>

  <div id="consommables">
    <div class="message">
      Chargement des consommables...
    </div>
  </div>

</main>

<script>

const SUPABASE_URL =
  "https://zqgoeskiwkyelsgzebyl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_6JPYka0ENCs3GFPgBlPZgQ_bN9chpvP";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

async function afficherUtilisateur() {

  const { data: { user } } =
    await supabaseClient.auth.getUser();

  const zone =
    document.getElementById("zone-utilisateur");

  if (!user) {
    return;
  }

  const { data: profil } =
    await supabaseClient
      .from("Profils")
      .select("prenom, nom, role")
      .eq("user_id", user.id)
      .single();

  if (profil) {

    zone.innerHTML = `
      <span>
        Bonjour ${profil.prenom} ${profil.nom}
      </span>

      <button onclick="deconnexion()">
        Se déconnecter
      </button>
    `;

  } else {

    zone.innerHTML = `
      <span>
        Bonjour
      </span>

      <button onclick="deconnexion()">
        Se déconnecter
      </button>
    `;
  }
}


async function deconnexion() {

  await supabaseClient.auth.signOut();

  window.location.reload();

}


afficherUtilisateur();
  
async function chargerConsommables() {

  const zone =
    document.getElementById("consommables");

  const resultat =
    await supabaseClient
      .from("Consommables")
      .select("*")
      .eq("Actif", true)
      .eq("disponible", true)
      .order("Date_ajout", {
        ascending: false
      });

  if (resultat.error) {

    console.error(resultat.error);

    zone.innerHTML = `
      <div class="message">
        Impossible de charger les consommables.
      </div>
    `;

    return;
  }

  const consommables = resultat.data;

  if (!consommables || consommables.length === 0) {

    zone.innerHTML = `
      <div class="message">
        Aucun consommable disponible actuellement.
      </div>
    `;

    return;
  }

  zone.innerHTML = "";

  consommables.forEach(function(consommable) {

    const card =
      document.createElement("div");

    card.className = "card";

    let photoHTML = "";

    if (consommable.photo) {

      photoHTML = `
        <img
          src="${consommable.photo}"
          alt="Photo du consommable"
        >
      `;

    }

    card.innerHTML = `

      ${photoHTML}

      <div class="card-content">

        <h3>
          ${consommable["Nom du sortant"]}
        </h3>

        <p>
          <strong>Catégorie :</strong>
          ${consommable.Categorie}
        </p>

        <p>
          <strong>Laboratoire :</strong>
          ${consommable.Laboratoire}
        </p>

        <p>
          ${consommable.Description || ""}
        </p>

        <p>
          <strong>État :</strong>
          ${consommable.Etat}
        </p>

        <p>
          <strong>Quantité :</strong>
          ${consommable.Quantite}
        </p>

        <button
          class="reserve"
          onclick="reserver('${consommable.id}')">
          Réserver
        </button>

      </div>
    `;

    zone.appendChild(card);

  });
}


function connexion() {

  alert(
    "La page de connexion sera ajoutée prochainement."
  );

}


function inscription() {

  alert(
    "La page d'inscription sera ajoutée prochainement."
  );

}


function reserver(id) {

  alert(
    "La réservation sera ajoutée prochainement."
  );

}


chargerConsommables();

</script>

</body>
</html>
