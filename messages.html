<body>

<header>
  <h1>Mes messages</h1>
</header>

<main>

  <!-- FORMULAIRE D'ENVOI -->

  <div class="formulaire-message">

    <h2>
      Envoyer un message
    </h2>

    <form id="formMessage">

      <p>
        <label for="sujet">
          Sujet
        </label>

      <input

        id="sujet"

      >

      <p>
        <label for="contenu">

        </label>
      </p>

      <textarea
        id="contenu"
        rows="6"
        required
      ></textarea>

      <p>
        <button
          type="submit"
          id="boutonEnvoyer">
          Envoyer le message
        </button>
      </p>

      <div id="messageFormulaire"></div>

    </form>

  </div>


  <!-- HISTORIQUE -->

  <h2>
    Mes conversations
  </h2>

  <div id="messages">

    <div class="chargement">
      Chargement de vos messages...
    </div>

  </div>


  <p>
    <a href="index.html">
      Retour aux consommables
    </a>

</main>


<script>

const SUPABASE_URL =
  "https://zqgoeskiwkyelsgzebyl.supabase.co";

const SUPABASE_KEY =
  "TA_PUBLISHABLE_KEY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/*
 * Échappe le contenu avant de l'afficher
 * dans du HTML.
 */

function echapperHTML(texte) {

  if (texte === null || texte === undefined) {
    return "";
  }

  return String(texte)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/*
 * Formate une date.
 */

function formaterDate(date) {

  if (!date) {
    return "";
  }

  const resultat =
    new Date(date).toLocaleString(
      "fr-FR"
    );

  return resultat;
}


/*
 * Charge les messages de l'utilisateur
 * actuellement connecté.
 */

async function chargerMessages() {

  const zone =
    document.getElementById(
      "messages"
    );


  zone.innerHTML = `
    <div class="chargement">
      Chargement de vos messages...
    </div>
  `;


  /*
   * Vérification de la connexion.
   */

  const {
    data: { user },
    error: erreurUtilisateur
  } =
    await supabaseClient.auth.getUser();


  if (
    erreurUtilisateur ||
    !user
  ) {

    zone.innerHTML = `
      <div class="message">
        Vous devez être connecté
        pour voir vos messages.
      </div>
    `;

    return;
  }


  /*
   * Recherche du profil correspondant
   * à l'utilisateur connecté.
   */

  const {
    data: profil,
    error: erreurProfil
  } =
    await supabaseClient
      .from("Profils")
      .select("id")
      .eq(
        "user_id",
        user.id
      )
      .single();


  if (
    erreurProfil ||
    !profil
  ) {

    console.error(
      "Erreur profil :",
      erreurProfil
    );

    zone.innerHTML = `
      <div class="message">
        Impossible de trouver votre profil.
      </div>
    `;

    return;
  }


  /*
   * Récupération des messages
   * appartenant à cet utilisateur.
   */

  const {
    data: messages,
    error: erreurMessages
  } =
    await supabaseClient
      .from("Messages")
      .select(`
        id,
        sujet,
        contenu,
        date_envoi,
        lu,
        repondu
      `)
      .eq(
        "utilisateur_id",
        profil.id
      )
      .order(
        "date_envoi",
        {
          ascending: false
        }
      );


  if (erreurMessages) {

    console.error(
      "Erreur chargement messages :",
      erreurMessages
    );

    zone.innerHTML = `
      <div class="message">
        Impossible de charger vos messages.
        <br><br>
        <small>
          ${echapperHTML(erreurMessages.message)}
        </small>
      </div>
    `;

    return;
  }


  /*
   * Aucun message.
   */

  if (
    !messages ||
    messages.length === 0
  ) {

    zone.innerHTML = `
      <div class="aucun-message">
        Vous n'avez encore envoyé aucun message.
      </div>
    `;

    return;
  }


  /*
   * On prépare l'affichage.
   */

  zone.innerHTML = "";


  /*
   * Chaque message devient une conversation.
   */

  for (
    const message
    of messages
  ) {


    /*
     * Récupération des réponses
     * liées à ce message.
     */

    const {
      data: reponses,
      error: erreurReponses
    } =
      await supabaseClient
        .from("ReponsesMessages")
        .select(`
          id,
          contenu,
          date_reponse,
          gestionnaire_id
        `)
        .eq(
          "message_id",
          message.id
        )
        .order(
          "date_reponse",
          {
            ascending: true
          }
        );


    if (erreurReponses) {

      console.error(
        "Erreur chargement réponses :",
        erreurReponses
      );

    }


    const listeReponses =
      reponses || [];


    /*
     * Détermination du statut.
     */

    let texteStatut =
      "Non lu";

    let classeStatut =
      "statut-non-lu";


    if (message.repondu) {

      texteStatut =
        "Répondu";

      classeStatut =
        "statut-repondu";

    }
    else if (message.lu) {

      texteStatut =
        "Lu";

      classeStatut =
        "statut-lu";

    }


    /*
     * Création de la carte.
     */

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "message";


    let html = `

      <h3>
        ${echapperHTML(message.sujet)}
      </h3>

      <div class="message-original">

        <p>
          <strong>
            Votre message
          </strong>
        </p>

        <p>
          ${echapperHTML(message.contenu)}
        </p>

        <p>
          <strong>
            Date :
          </strong>

          ${formaterDate(message.date_envoi)}
        </p>

      </div>

      <p class="statut ${classeStatut}">

        <strong>
          Statut :
        </strong>

        ${texteStatut}

      </p>

    `;


    /*
     * Affichage des réponses
     * du gestionnaire.
     */

    if (
      listeReponses.length > 0
    ) {

      html += `

        <hr>

        <h4>
          Réponse(s) du gestionnaire
        </h4>

      `;


      listeReponses.forEach(
        function(reponse) {

          html += `

            <div class="reponse">

              <p>
                <strong>
                  Gestionnaire
                </strong>
              </p>

              <p>
                ${echapperHTML(
                  reponse.contenu
                )}
              </p>

              <p>

                <strong>
                  Date :
                </strong>

                ${formaterDate(
                  reponse.date_reponse
                )}

              </p>

            </div>

          `;

        }
      );

    }
    else {

      html += `

        <p>
          <em>
            Aucune réponse du gestionnaire pour le moment.
          </em>
        </p>

      `;

    }


    card.innerHTML =
      html;


    zone.appendChild(
      card
    );

  }

}


/*
 * Envoi d'un nouveau message.
 */

document
  .getElementById("formMessage")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const sujet =
        document
          .getElementById("sujet")
          .value
          .trim();


      const contenu =
        document
          .getElementById("contenu")
          .value
          .trim();


      const zoneMessage =
        document.getElementById(
          "messageFormulaire"
        );


      const bouton =
        document.getElementById(
          "boutonEnvoyer"
        );


      zoneMessage.className =
        "";


      /*
       * Vérification des champs.
       */

      if (
        !sujet ||
        !contenu
      ) {

        zoneMessage.className =
          "erreur";

        zoneMessage.textContent =
          "Veuillez remplir tous les champs.";

        return;
      }


      /*
       * Désactivation du bouton
       * pendant l'envoi.
       */

      bouton.disabled =
        true;

      bouton.textContent =
        "Envoi en cours...";


      try {


        /*
         * Vérification de l'utilisateur.
         */

        const {
          data: { user },
          error: erreurUtilisateur
        } =
          await supabaseClient.auth.getUser();


        if (
          erreurUtilisateur ||
          !user
        ) {

          zoneMessage.className =
            "erreur";

          zoneMessage.textContent =
            "Vous devez être connecté pour envoyer un message.";

          return;
        }


        /*
         * Recherche du profil.
         */

        const {
          data: profil,
          error: erreurProfil
        } =
          await supabaseClient
            .from("Profils")
            .select("id")
            .eq(
              "user_id",
              user.id
            )
            .single();


        if (
          erreurProfil ||
          !profil
        ) {

          console.error(
            "Erreur profil :",
            erreurProfil
          );

          zoneMessage.className =
            "erreur";

          zoneMessage.textContent =
            "Impossible de trouver votre profil.";

          return;
        }


        /*
         * Création du message.
         */

        const {
          data: nouveauMessage,
          error: erreurInsertion
        } =
          await supabaseClient
            .from("Messages")
            .insert({

              utilisateur_id:
                profil.id,

              sujet:
                sujet,

              contenu:
                contenu,

              lu:
                false,

              repondu:
                false

            })
            .select()
            .single();


        if (
          erreurInsertion
        ) {

          console.error(
            "Erreur insertion message :",
            erreurInsertion
          );

          zoneMessage.className =
            "erreur";

          zoneMessage.textContent =
            "Impossible d'envoyer le message : " +
            erreurInsertion.message;

          return;
        }


        /*
         * Message envoyé avec succès.
         */

        console.log(
          "Message créé :",
          nouveauMessage
        );


        zoneMessage.className =
          "succes";

        zoneMessage.textContent =
          "Votre message a bien été envoyé.";


        /*
         * Nettoyage du formulaire.
         */

        document
          .getElementById("sujet")
          .value = "";


        document
          .getElementById("contenu")
          .value = "";


        /*
         * Rechargement de l'historique.
         */

        await chargerMessages();


      }
      catch (erreur) {

        console.error(
          "Erreur inattendue :",
          erreur
        );

        zoneMessage.className =
          "erreur";

        zoneMessage.textContent =
          "Une erreur est survenue pendant l'envoi.";

      }
      finally {

        bouton.disabled =
          false;

        bouton.textContent =
          "Envoyer le message";

      }

    }
  );


/*
 * Chargement initial.
 */

chargerMessages();

</script>

</body>
</html>
