<script>

const SUPABASE_URL =
  "https://zqgoeskiwkyelsgzebyl.supabase.co";

const SUPABASE_KEY =

const supabaseClient =

/*
 * Échappe le contenu avant de l'afficher
 * dans du HTML.
 */

function echapperHTML(texte) {

  if (texte === null || texte === undefined) {
    return "";
  }

  return String(texte)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/*
 * Formate une date.
 */

function formaterDate(date) {

  if (!date) {
    return "";
  }

  const resultat =
    new Date(date).toLocaleString(
      "fr-FR"
    );

  return resultat;
}


/*
 * Charge les messages de l'utilisateur
 * actuellement connecté.
 */

async function chargerMessages() {

  const zone =
    document.getElementById(
      "messages"
    );


  zone.innerHTML = `
    <div class="chargement">
      Chargement de vos messages...
    </div>
  `;


  /*
   * Vérification de la connexion.
   */

  const {
    data: { user },
    error: erreurUtilisateur
  } =
    await supabaseClient.auth.getUser();


  if (
    erreurUtilisateur ||
    !user
  ) {

    zone.innerHTML = `
      <div class="message">
        Vous devez être connecté
        pour voir vos messages.
      </div>
    `;

    return;
  }


  /*
   * Recherche du profil correspondant
   * à l'utilisateur connecté.
   */

  const {
    data: profil,
    error: erreurProfil
  } =
    await supabaseClient
      .from("Profils")
      .select("id")
      .eq(
        "user_id",
        user.id
      )
      .single();


  if (
    erreurProfil ||
    !profil
  ) {

    console.error(
      "Erreur profil :",
      erreurProfil
    );

    zone.innerHTML = `
      <div class="message">
        Impossible de trouver votre profil.
      </div>
    `;

    return;
  }


  /*
   * Récupération des messages
   * appartenant à cet utilisateur.
   */

  const {
    data: messages,
    error: erreurMessages
  } =
    await supabaseClient
      .from("Messages")
      .select(`
        id,
        sujet,
        contenu,
        date_envoi,
        lu,
        repondu
      `)
      .eq(
        "utilisateur_id",
        profil.id
      )
      .order(
        "date_envoi",
        {
          ascending: false
        }
      );


  if (erreurMessages) {

    console.error(
      "Erreur chargement messages :",
      erreurMessages
    );

    zone.innerHTML = `
      <div class="message">
        Impossible de charger vos messages.
        <br><br>
        <small>
          ${echapperHTML(erreurMessages.message)}
        </small>
      </div>
    `;

    return;
  }


  /*
   * Aucun message.
   */

  if (
    !messages ||
    messages.length === 0
  ) {

    zone.innerHTML = `
      <div class="aucun-message">
        Vous n'avez encore envoyé aucun message.
      </div>
    `;

    return;
  }


  /*
   * On prépare l'affichage.
   */

  zone.innerHTML = "";


  /*
   * Chaque message devient une conversation.
   */

  for (
    const message
    of messages
  ) {


    /*
     * Récupération des réponses
     * liées à ce message.
     */

    const {
      data: reponses,
      error: erreurReponses
    } =
      await supabaseClient
        .from("ReponsesMessages")
        .select(`
          id,
          contenu,
          date_reponse,
          gestionnaire_id
        `)
        .eq(
          "message_id",
          message.id
        )
        .order(
          "date_reponse",
          {
            ascending: true
          }
        );


    if (erreurReponses) {

      console.error(
        "Erreur chargement réponses :",
        erreurReponses
      );

    }


    const listeReponses =
      reponses || [];


    /*
     * Détermination du statut.
     */

    let texteStatut =
      "Non lu";

    let classeStatut =
      "statut-non-lu";


    if (message.repondu) {

      texteStatut =
        "Répondu";

      classeStatut =
        "statut-repondu";

    }
    else if (message.lu) {

      texteStatut =
        "Lu";

      classeStatut =
        "statut-lu";

    }


    /*
     * Création de la carte.
     */

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "message";


    let html = `

      <h3>
        ${echapperHTML(message.sujet)}
      </h3>

      <div class="message-original">

        <p>
          <strong>
            Votre message
          </strong>
        </p>

        <p>
          ${echapperHTML(message.contenu)}
        </p>

        <p>
          <strong>
            Date :
          </strong>

          ${formaterDate(message.date_envoi)}
        </p>

      </div>

      <p class="statut ${classeStatut}">

        <strong>
          Statut :
        </strong>

        ${texteStatut}

      </p>

    `;


       /*
     * Affichage des réponses
     * du gestionnaire.
     */

    if (
      listeReponses.length > 0
    ) {

      html += `

        <hr>

        <h4>
          Réponse(s) du gestionnaire
        </h4>

      `;


     listeReponses.forEach(
  function(reponse) {

    const auteur =
      reponse.gestionnaire_id
        ? "Gestionnaire"
        : "Vous";

    html += `

      <div class="reponse">

        <p>
          <strong>
            ${auteur}
          </strong>
        </p>

        <p>
          ${echapperHTML(
            reponse.contenu
          )}
        </p>

        <p>

          <strong>
            Date :
          </strong>

          ${formaterDate(
            reponse.date_reponse
          )}

        </p>

      </div>

    `;

  }
);


      /*
       * Formulaire pour continuer
       * la conversation.
       */

      html += `

        <div
          class="reponse-utilisateur"
          style="
            margin-top:15px;
            padding:15px;
            border-top:1px solid #ddd;
          "
        >

          <textarea
            id="reponse-utilisateur-${message.id}"
            rows="4"
            placeholder="Écrire une réponse..."

            "

            type="button"

          </button>

            style="margin-top:10px;"
          ></div>

        </div>

      `;

    }
    else {

      html += `

        <p>
          <em>
            Aucune réponse du gestionnaire pour le moment.
          </em>
        </p>

      `;

    }


    card.innerHTML =
      html;

    zone.appendChild(
      card
    );

    }

}

/* =========================================================
   REPONSE DE L'UTILISATEUR A UNE CONVERSATION EXISTANTE
   ========================================================= */

async function repondreUtilisateur(messageId) {

  const zoneReponse =
    document.getElementById(
      `reponse-utilisateur-${messageId}`
    );

  const resultat =
    document.getElementById(
      `resultat-reponse-utilisateur-${messageId}`
    );


  if (!zoneReponse || !resultat) {

    console.error(
      "Zone de réponse introuvable pour :",
      messageId
    );

    return;

  }


  const contenu =
    zoneReponse.value.trim();


  if (!contenu) {

    resultat.className =
      "erreur";

    resultat.textContent =
      "Veuillez écrire une réponse.";

    return;

  }


  try {

    /*
     * UTILISATEUR CONNECTÉ
     */

    const {
      data: { user },
      error: erreurUtilisateur
    } =
      await supabaseClient.auth.getUser();


    if (
      erreurUtilisateur ||
      !user
    ) {

      throw new Error(
        "Vous devez être connecté."
      );

    }


    /*
     * PROFIL UTILISATEUR
     */

    const {
      data: profil,
      error: erreurProfil
    } =
      await supabaseClient
        .from("Profils")
        .select("id")
        .eq(
          "user_id",
          user.id
        )
        .single();


    if (
      erreurProfil ||
      !profil
    ) {

      throw new Error(
        "Impossible de trouver votre profil."
      );

    }


    /*
     * VERIFIER LA CONVERSATION
     */

    const {
      data: messageOriginal,
      error: erreurMessage
    } =
      await supabaseClient
        .from("Messages")
        .select(`
          id,
          utilisateur_id,
          sujet
        `)
        .eq(
          "id",
          messageId
        )
        .eq(
          "utilisateur_id",
          profil.id
        )
        .single();


    if (
      erreurMessage ||
      !messageOriginal
    ) {

      throw new Error(
        "Conversation introuvable ou accès non autorisé."
      );

    }


    /*
     * ENREGISTRER LA REPONSE
     *
     * IMPORTANT :
     * gestionnaire_id = NULL
     *
     * Cela indique que la réponse
     * vient de l'utilisateur.
     */

    const {
      data: nouvelleReponse,
      error: erreurInsertion
    } =
      await supabaseClient
        .from("ReponsesMessages")
        .insert({

          message_id:
            messageId,

          gestionnaire_id:
            null,

          contenu:
            contenu

        })
        .select()
        .single();


    if (erreurInsertion) {

      throw erreurInsertion;

    }


    console.log(
      "Réponse utilisateur enregistrée :",
      nouvelleReponse
    );


    /*
     * LE MESSAGE ATTEND UNE REPONSE
     * DU GESTIONNAIRE
     */

    const {
      error: erreurStatut
    } =
      await supabaseClient
        .from("Messages")
        .update({

          repondu:
            false,

          lu:
            false

        })
        .eq(
          "id",
          messageId
        );


    if (erreurStatut) {

      throw erreurStatut;

    }


    /*
     * RECUPERER LES GESTIONNAIRES
     */

    const {
      data: gestionnaires,
      error: erreurGestionnaires
    } =
      await supabaseClient
        .from("Profils")
        .select(`
          id,
          user_id,
          role
        `)
        .in(
          "role",
          [
            "gestionnaire",
            "administrateur"
          ]
        );


    if (erreurGestionnaires) {

      throw erreurGestionnaires;

    }


    console.log(
      "Gestionnaires trouvés :",
      gestionnaires
    );


    /*
     * CREER UNE NOTIFICATION POUR
     * CHAQUE GESTIONNAIRE
     */

    if (
      gestionnaires &&
      gestionnaires.length > 0
    ) {

      const notifications =
        gestionnaires
          .filter(
            gestionnaire =>
              gestionnaire.user_id
          )
          .map(
            gestionnaire => ({

              user_id:
                gestionnaire.user_id,

              titre:
                "Nouvelle réponse utilisateur",

              message:
                `L'utilisateur a répondu à la conversation "${messageOriginal.sujet}".`,

              type:
                "message",

              lu:
                false,

              date_creation:
                new Date().toISOString(),

              lien:
                "/gestion-consommables/gestionnaire.html"

            })
          );


      console.log(
        "Notifications à créer :",
        notifications
      );


      if (
        notifications.length > 0
      ) {

        const {
          data: notificationsCreees,
          error: erreurNotification
        } =
          await supabaseClient
            .from("Notifications")
            .insert(
              notifications
            )
            .select();


        if (erreurNotification) {

          console.error(
            "ERREUR INSERTION NOTIFICATION :",
            erreurNotification
          );

          throw erreurNotification;

        }


        console.log(
          "Notifications créées :",
          notificationsCreees
        );

      }

    }


    /*
     * CONFIRMATION
     */

    resultat.className =
      "succes";

    resultat.textContent =
      "Votre réponse a bien été envoyée.";


    zoneReponse.value =
      "";


    /*
     * ACTUALISER LA CONVERSATION
     */

    await chargerMessages();

  }

  catch (erreur) {

    console.error(
      "Erreur réponse utilisateur :",
      erreur
    );

    resultat.className =
      "erreur";

    resultat.textContent =
      erreur.message;

  }

}
        /*
         * Message envoyé avec succès.
         */

        console.log(
          "Message créé :",
          nouveauMessage
        );


        zoneMessage.className =
          "succes";

        zoneMessage.textContent =
          "Votre message a bien été envoyé.";


        /*
         * Nettoyage du formulaire.
         */

        document
          .getElementById("sujet")
          .value = "";


        document
          .getElementById("contenu")
          .value = "";


        /*
         * Rechargement de l'historique.
         */

        await chargerMessages();


      }
      catch (erreur) {

        console.error(
          "Erreur inattendue :",
          erreur
        );

        zoneMessage.className =
          "erreur";

        zoneMessage.textContent =
          "Une erreur est survenue pendant l'envoi.";

      }
      finally {

        bouton.disabled =
          false;

        bouton.textContent =
          "Envoyer le message";

      }

    }
  );


/*

 */

chargerMessages();

</script>
