<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mes messages</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 40px;
      border-bottom: 1px solid #e5e7eb;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .message {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    a {
      color: #2563eb;
    }
  </style>
</head>

<body>

<header>
  <h1>Mes messages</h1>
</header>

<main>

  <div id="messages">
    Chargement de vos messages...
  </div>

  <p>
    <a href="index.html">
      Retour aux consommables
    </a>
  </p>

</main>

<script>

const SUPABASE_URL =
  "https://zqgoeskiwkyelsgzebyl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_6JPYka0ENCs3GFPgBlPZgQ_bN9chpvP";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
async function chargerMessages() {

  const zone =
    document.getElementById("messages");


  const {
    data: { user }
  } = await supabaseClient.auth.getUser();


  if (!user) {

    zone.innerHTML = `
      <div class="message">
        Vous devez être connecté pour voir vos messages.
      </div>
    `;

    return;
  }


  const { data: profil, error: profilError } =
    await supabaseClient
      .from("Profils")
      .select("id")
      .eq("user_id", user.id)
      .single();


  if (profilError || !profil) {

    zone.innerHTML = `
      <div class="message">
        Impossible de trouver votre profil.
      </div>
    `;

    return;
  }


  const { data, error } =
    await supabaseClient
      .from("Messages")
      .select(`
        id,
        sujet,
        contenu,
        date_envoi,
        lu
      `)
      .eq("utilisateur_id", profil.id)
      .order("date_envoi", {
        ascending: false
      });


  if (error) {

    console.error(error);

    zone.innerHTML = `
      <div class="message">
        Impossible de charger vos messages.
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    zone.innerHTML = `
      <div class="message">
        Vous n'avez encore envoyé aucun message.
      </div>
    `;

    return;
  }


  zone.innerHTML = "";


  data.forEach(function(message) {

    const card =
      document.createElement("div");

    card.className =
      "message";


    card.innerHTML = `

      <h3>
        ${message.sujet}
      </h3>

      <p>
        ${message.contenu}
      </p>

      <p>
        <strong>Date :</strong>
        ${new Date(message.date_envoi).toLocaleString("fr-FR")}
      </p>

      <p>
        <strong>Statut :</strong>
        ${message.lu ? "Lu" : "Non lu"}
      </p>

    `;


    zone.appendChild(card);

  });

}


chargerMessages();
</script>

</body>
</html>
