<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mes messages</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 40px;
      border-bottom: 1px solid #e5e7eb;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .message {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    a {
      color: #2563eb;
    }
  </style>
</head>

<body>

<header>
  <h1>Mes messages</h1>
</header>

<main>
<div class="message">
  <h2>Envoyer un message</h2>

  <form id="formMessage">

    <p>
      <label for="sujet">Sujet</label>
    </p>

    <input
      type="text"
      id="sujet"
      required
      style="width:100%; padding:10px; box-sizing:border-box;"
    >

    <p>
      <label for="contenu">Message</label>
    </p>

    <textarea
      id="contenu"
      rows="6"
      required
      style="width:100%; padding:10px; box-sizing:border-box;"
    ></textarea>

    <p>
      <button type="submit">
        Envoyer le message
      </button>
    </p>

    <div id="messageFormulaire"></div>

  </form>
</div>
  <div id="messages">
    Chargement de vos messages...
  </div>

  <p>
    <a href="index.html">
      Retour aux consommables
    </a>
  </p>

</main>

<script>

const SUPABASE_URL =
  "https://zqgoeskiwkyelsgzebyl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_6JPYka0ENCs3GFPgBlPZgQ_bN9chpvP";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
async function chargerMessages() {

  const zone =
    document.getElementById("messages");


  const {
    data: { user }
  } = await supabaseClient.auth.getUser();


  if (!user) {

    zone.innerHTML = `
      <div class="message">
        Vous devez être connecté pour voir vos messages.
      </div>
    `;

    return;
  }


  const { data: profil, error: profilError } =
    await supabaseClient
      .from("Profils")
      .select("id")
      .eq("user_id", user.id)
      .single();


  if (profilError || !profil) {

    zone.innerHTML = `
      <div class="message">
        Impossible de trouver votre profil.
      </div>
    `;

    return;
  }


  const { data, error } =
    await supabaseClient
      .from("Messages")
      .select(`
        id,
        sujet,
        contenu,
        date_envoi,
        lu
      `)
      .eq("utilisateur_id", profil.id)
      .order("date_envoi", {
        ascending: false
      });


  if (error) {

    console.error(error);

    zone.innerHTML = `
      <div class="message">
        Impossible de charger vos messages.
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    zone.innerHTML = `
      <div class="message">
        Vous n'avez encore envoyé aucun message.
      </div>
    `;

    return;
  }


  zone.innerHTML = "";


  data.forEach(function(message) {

    const card =
      document.createElement("div");

    card.className =
      "message";


    card.innerHTML = `

      <h3>
        ${message.sujet}
      </h3>

      <p>
        ${message.contenu}
      </p>

      <p>
        <strong>Date :</strong>
        ${new Date(message.date_envoi).toLocaleString("fr-FR")}
      </p>

      <p>
        <strong>Statut :</strong>
        ${message.lu ? "Lu" : "Non lu"}
      </p>

    `;


    zone.appendChild(card);

  });

}


chargerMessages();
document
  .getElementById("formMessage")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const sujet =
      document.getElementById("sujet").value.trim();

    const contenu =
      document.getElementById("contenu").value.trim();

    const zoneMessage =
      document.getElementById("messageFormulaire");


    if (!sujet || !contenu) {

      zoneMessage.textContent =
        "Veuillez remplir tous les champs.";

      return;
    }


    const {
      data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) {

      zoneMessage.textContent =
        "Vous devez être connecté pour envoyer un message.";

      return;
    }


    const { data: profil, error: profilError } =
      await supabaseClient
        .from("Profils")
        .select("id")
        .eq("user_id", user.id)
        .single();


    if (profilError || !profil) {

      zoneMessage.textContent =
        "Impossible de trouver votre profil.";

      return;
    }


    const { error } =
      await supabaseClient
        .from("Messages")
        .insert({
          utilisateur_id: profil.id,
          sujet: sujet,
          contenu: contenu
        });


    if (error) {

      console.error(error);

      zoneMessage.textContent =
        "Impossible d'envoyer le message.";

      return;
    }


    zoneMessage.textContent =
      "Votre message a bien été envoyé.";


    document
      .getElementById("sujet")
      .value = "";

    document
      .getElementById("contenu")
      .value = "";


    chargerMessages();

  });
</script>

</body>
</html>
